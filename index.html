<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Comercial Envigado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#222;background:#f5f6f8}
header{padding:18px;background:#fff;border-bottom:1px solid #ddd}header h1{margin:0 0 6px;font-size:23px}header p{margin:0;color:#666;font-size:14px}
.search-area{display:grid;gap:10px;padding:12px;background:#fff}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:#fff}
#map{height:55vh;min-height:350px;width:100%}#map.picking{cursor:crosshair}
#results{padding:14px}.business{padding:14px;margin-bottom:10px;background:#fff;border:1px solid #e2e2e2;border-radius:10px}
.business h3{margin:0 0 6px;font-size:17px}.business p{margin:4px 0;color:#555;font-size:14px}
.badge{display:inline-block;margin:6px 6px 0 0;padding:5px 8px;border-radius:5px;background:#fef3c7;color:#92400e;font-size:12px}
.badge.ok{background:#eaf5ef;color:#276749}
button{margin-top:8px;padding:8px 12px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-size:13px;cursor:pointer}
#msg{padding:10px 14px;background:#e0f2fe;font-size:14px;display:none}
footer{padding:14px;font-size:12px;color:#666;text-align:center}textarea{width:100%;height:160px;font-size:13px}
</style></head><body>
<header><h1>Mapa Comercial Envigado</h1><p>Descubre los negocios del centro de Envigado.</p></header>
<section class="search-area">
<input id="search" type="search" placeholder="Buscar un negocio..." aria-label="Buscar un negocio">
<select id="category" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
</section>
<div id="msg"></div>
<div id="map"></div>
<section id="results"><h2>Negocios</h2><div id="business-list"></div>
<details><summary>Exportar datos para negocios.js</summary><textarea id="exp" readonly></textarea></details></section>
<footer>Demo inicial. Información pendiente de verificación. Mapa © OpenStreetMap contributors.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="negocios.js"></script>
<script>
// Coordenadas guardadas en el navegador (se combinan con negocios.js)
let saved={};try{saved=JSON.parse(localStorage.getItem("env-loc")||"{}")}catch(e){}
negocios.forEach(n=>{if(saved[n.id]&&n.lat==null){n.lat=saved[n.id].lat;n.lng=saved[n.id].lng;n.estado="Ubicación sin verificar"}});
const map=L.map("map").setView([6.1736,-75.5865],17);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const list=document.getElementById("business-list"),search=document.getElementById("search"),category=document.getElementById("category"),msg=document.getElementById("msg");
[...new Set(negocios.map(n=>n.categoria))].sort().forEach(c=>{const o=document.createElement("option");o.value=o.textContent=c;category.appendChild(o)});
let picking=null;
const has=n=>Number.isFinite(n.lat)&&Number.isFinite(n.lng);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function render(){
  const q=norm(search.value.trim()),cat=category.value;
  list.innerHTML="";layer.clearLayers();
  const f=negocios.filter(n=>norm(n.nombre).includes(q)&&(!cat||n.categoria===cat));
  f.forEach(n=>{
    const a=document.createElement("article");a.className="business";
    a.innerHTML=`<h3>${esc(n.nombre)}</h3><p>Categoría: ${esc(n.categoria)}</p><span class="badge ${has(n)?"ok":""}">${esc(n.estado)}</span>`;
    const b=document.createElement("button");b.textContent=has(n)?"Mover en el mapa":"Ubicar en el mapa";
    b.onclick=e=>{e.stopPropagation();picking=n;msg.style.display="block";msg.textContent="Haz clic en el mapa donde está «"+n.nombre+"».";document.getElementById("map").classList.add("picking");window.scrollTo({top:0,behavior:"smooth"})};
    a.appendChild(b);
    if(has(n)){
      const m=L.marker([n.lat,n.lng]).addTo(layer).bindPopup(`<strong>${esc(n.nombre)}</strong><br>${esc(n.categoria)}`);
      a.style.cursor="pointer";a.onclick=()=>{map.setView([n.lat,n.lng],18);m.openPopup()};
    }
    list.appendChild(a);
  });
  if(!f.length)list.textContent="No se encontraron negocios.";
  document.getElementById("exp").value="const negocios = "+JSON.stringify(negocios,null,2)+";";
}
map.on("click",e=>{
  if(!picking)return;
  picking.lat=+e.latlng.lat.toFixed(6);picking.lng=+e.latlng.lng.toFixed(6);picking.estado="Ubicación sin verificar";
  saved[picking.id]={lat:picking.lat,lng:picking.lng};
  try{localStorage.setItem("env-loc",JSON.stringify(saved))}catch(_){}
  picking=null;msg.style.display="none";document.getElementById("map").classList.remove("picking");render();
});
search.addEventListener("input",render);category.addEventListener("change",render);
render();
</script></body></html>
